name: Byg Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Opret Android App og Widget filer
        run: |
          mkdir -p android-app/app/src/main/java/com/nomminnet/widgethub
          mkdir -p android-app/app/src/main/res/layout
          mkdir -p android-app/app/src/main/res/drawable
          mkdir -p android-app/app/src/main/res/xml

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WidgetHub"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.nomminnet.widgethub'
              compileSdk 34

              defaultConfig {
                  applicationId "com.nomminnet.widgethub"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {}
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="Widget Hub"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".BtcWidget"
                      android:exported="true"
                      android:label="Bitcoin Live">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.nomminnet.widgethub.ACTION_REFRESH" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/btc_widget_info" />
                  </receiver>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0B0F19"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#151C2C"
                  android:strokeColor="#263147"
                  android:strokeWidth="2"
                  android:pathData="M24,16 L84,16 A8,8 0 0,1 92,24 L92,84 A8,8 0 0,1 84,92 L24,92 A8,8 0 0,1 16,84 L16,24 A8,8 0 0,1 24,16 Z" />
              <path
                  android:fillColor="#F7931A"
                  android:pathData="M54,30 A24,24 0 1,1 53.9,30 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M48,40 L58,40 C62,40 64,42 64,45 C64,47.5 62.5,49 60,49.5 C63,50.5 65,52.5 65,56 C65,60 62,62 57,62 L48,62 Z M52,44 L52,48 L57,48 C59,48 60,47 60,46 C60,45 59,44 57,44 Z M52,52 L52,58 L57.5,58 C59.5,58 61,57 61,55 C61,53 59.5,52 57.5,52 Z" />
              <path
                  android:fillColor="#3FB950"
                  android:pathData="M80,28 A5,5 0 1,1 79.9,28 Z" />
          </vector>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#151C2C" />
              <corners android:radius="18dp" />
              <stroke android:width="1dp" android:color="#263147" />
          </shape>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/btc_circle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#F7931A" />
          </shape>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/drawable/badge_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#1E293B" />
              <corners android:radius="8dp" />
          </shape>
          EOF

          cat << 'EOF' > android-app/app/src/main/res/xml/btc_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_btc"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

          cat << 'EOF' > android-app/app/src/main/res/layout/widget_btc.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:orientation="vertical"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <TextView
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:background="@drawable/btc_circle"
                      android:gravity="center"
                      android:text="₿"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/open_app_title"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:layout_weight="1"
                      android:text="BITCOIN LIVE"
                      android:textColor="#8B949E"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_change"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="@drawable/badge_bg"
                      android:paddingLeft="8dp"
                      android:paddingTop="3dp"
                      android:paddingRight="8dp"
                      android:paddingBottom="3dp"
                      android:text="0.00%"
                      android:textColor="#3FB950"
                      android:textSize="12sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/widget_refresh"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:background="@drawable/badge_bg"
                      android:paddingLeft="8dp"
                      android:paddingTop="3dp"
                      android:paddingRight="8dp"
                      android:paddingBottom="3dp"
                      android:text="↻"
                      android:textColor="#F0F6FC"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <TextView
                  android:id="@+id/widget_price"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="Tryk ↻ for kurs"
                  android:textColor="#3FB950"
                  android:textSize="28sp"
                  android:textStyle="bold" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:orientation="horizontal">

                  <TextView
                      android:id="@+id/widget_stats"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="Tryk på ↻ for opdatering"
                      android:textColor="#8B949E"
                      android:textSize="11sp" />

                  <TextView
                      android:id="@+id/widget_time"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Åbn App ↗"
                      android:textColor="#8B949E"
                      android:textSize="11sp" />
              </LinearLayout>

          </LinearLayout>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/nomminnet/widgethub/MainActivity.java
          package com.nomminnet.widgethub;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Window;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Window window = getWindow();
                  window.setStatusBarColor(Color.parseColor("#0B0F19"));
                  window.setNavigationBarColor(Color.parseColor("#0B0F19"));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#0B0F19"));
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://nomminnet-bit.github.io/Widget-hub/");
                  setContentView(webView);

                  BtcWidget.triggerRefresh(this);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/nomminnet/widgethub/BtcWidget.java
          package com.nomminnet.widgethub;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.widget.RemoteViews;

          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.Executors;

          public class BtcWidget extends AppWidgetProvider {
              public static final String ACTION_REFRESH = "com.nomminnet.widgethub.ACTION_REFRESH";

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  final PendingResult result = goAsync();
                  updateWidgets(context, appWidgetManager, appWidgetIds, result);
              }

              @Override
              public void onReceive(Context context, Intent intent) {
                  super.onReceive(context, intent);
                  if (ACTION_REFRESH.equals(intent.getAction())) {
                      final PendingResult result = goAsync();
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      int[] ids = manager.getAppWidgetIds(new ComponentName(context, BtcWidget.class));
                      updateWidgets(context, manager, ids, result);
                  }
              }

              public static void triggerRefresh(Context context) {
                  Intent intent = new Intent(context, BtcWidget.class);
                  intent.setAction(ACTION_REFRESH);
                  context.sendBroadcast(intent);
              }

              private void updateWidgets(Context context, AppWidgetManager manager, int[] ids, PendingResult pendingResult) {
                  Executors.newSingleThreadExecutor().execute(() -> {
                      try {
                          RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.widget_btc);

                          Intent refreshIntent = new Intent(context, BtcWidget.class);
                          refreshIntent.setAction(ACTION_REFRESH);
                          PendingIntent refreshPending = PendingIntent.getBroadcast(
                                  context, 0, refreshIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          views.setOnClickPendingIntent(R.id.widget_refresh, refreshPending);
                          views.setOnClickPendingIntent(R.id.widget_price, refreshPending);

                          Intent appIntent = new Intent(context, MainActivity.class);
                          PendingIntent appPending = PendingIntent.getActivity(
                                  context, 1, appIntent,
                                  PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                          );
                          views.setOnClickPendingIntent(R.id.open_app_title, appPending);
                          views.setOnClickPendingIntent(R.id.widget_time, appPending);

                          URL url = new URL("https://data-api.binance.vision/api/v3/ticker/24hr?symbol=BTCUSDT");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);

                          BufferedReader reader = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = reader.readLine()) != null) {
                              sb.append(line);
                          }
                          reader.close();

                          JSONObject json = new JSONObject(sb.toString());
                          double price = json.getDouble("lastPrice");
                          double change = json.getDouble("priceChangePercent");
                          double high = json.getDouble("highPrice");
                          double low = json.getDouble("lowPrice");

                          String formattedPrice = String.format(Locale.US, "$%,.2f", price);
                          String sign = change >= 0 ? "+" : "";
                          String formattedChange = String.format(Locale.US, "%s%.2f%%", sign, change);
                          String statsText = String.format(Locale.US, "24t Høj: $%,.0f  •  Lav: $%,.0f", high, low);
                          String timeText = "Kl. " + new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date()) + " ↗";

                          int color = change >= 0 ? Color.parseColor("#3FB950") : Color.parseColor("#F85149");

                          views.setTextViewText(R.id.widget_price, formattedPrice);
                          views.setTextColor(R.id.widget_price, color);
                          views.setTextViewText(R.id.widget_change, formattedChange);
                          views.setTextColor(R.id.widget_change, color);
                          views.setTextViewText(R.id.widget_stats, statsText);
                          views.setTextViewText(R.id.widget_time, timeText);

                          for (int id : ids) {
                              manager.updateAppWidget(id, views);
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      } finally {
                          if (pendingResult != null) {
                              pendingResult.finish();
                          }
                      }
                  });
              }
          }
          EOF

      - name: Byg APK med Gradle
        run: |
          gradle -p android-app assembleDebug
          cp android-app/app/build/outputs/apk/debug/app-debug.apk WidgetHub.apk

      - name: Udgiv WidgetHub.apk under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: "Widget Hub App (APK)"
          files: 
